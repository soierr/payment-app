name: Build
run-name: ${{ github.actor }} 

on:
  push:
    branches: [ main ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'oracle-openjdk'
    - name: Build with Maven
      run: mvn clean package    
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      id: test-results
      if: (!cancelled())
      with:
        files: "./payment-app-main/target/surefire-reports/*.xml"
        job_summary: false
    - uses: actions/checkout@v7
      with:
        ref: badges
    - name: Conclusion
      run: echo "Conclusion is ${{ fromJSON( steps.test-results.outputs.json ).conclusion }}"
    - name: Generate the badge SVG image
      uses: emibcn/badge-action@v2.0.4
      id: badges
      with:
        label: 'Test coverage'
        label-color: 'black'
        status: 90        
        color: 'green'
        path: ./coverage-badge.svg
    - name: Check current folder
      run: ls -al
    - name: Check Untracked
      id: untracked
      run: |
        IS_UNTRACKED=$(echo $(git status | grep -c Untracked))
        echo "exist=${IS_UNTRACKED}" >> "${GITHUB_OUTPUT}"
    - name: Commit Coverage Badge
      if: ${{ steps.untracked.outputs.exist }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add ./coverage-badge.svg
        git commit -m "Add/Update coverage badge"
    - name: Push badge commit
      uses: ad-m/github-push-action@master
      if: ${{ success() }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: badges
      
  
