name: Build
run-name: ${{ github.actor }} 

on:
  push:
    branches: [ main ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'oracle-openjdk'
    - name: Build with Maven
      run: mvn clean package    
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      id: test-results
      if: (!cancelled())
      with:
        files: "./payment-app-2-main/target/surefire-reports/*.xml"
        job_summary: false    
    - name: Check current folder
      run: ls -al
    - uses: actions/checkout@v7
      with:
        ref: badges
        clean: false
    - name: Conclusion
      run: echo "Conclusion is ${{ fromJSON( steps.test-results.outputs.json ).conclusion }}"
    - name: Check current folder
      run: ls -al
    - name: Generate tests badge SVG image
      uses: emibcn/badge-action@v2.0.4
      id: tests-badge
      with:
        label: 'Tests'
        label-color: 'black'
        status: 'All: ${{ fromJSON( steps.test-results.outputs.json ).stats.tests }}, Success: ${{ fromJSON( steps.test-results.outputs.json ).stats.tests_succ }}, Failures: ${{ fromJSON( steps.test-results.outputs.json ).stats.tests_fail }}, Errors: ${{ fromJSON( steps.test-results.outputs.json ).stats.tests_fail }}, Skipped: ${{ fromJSON( steps.test-results.outputs.json ).stats.tests_skip }}'
        color: '640'
        path: ./tests-summary.svg
    - name: Generate JaCoCo Badge
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: ./payment-app-2-main/target/site/jacoco/jacoco.csv
        badges-directory: .
        generate-coverage-badge: true
        coverage-badge-filename: jacoco-coverage.svg
        generate-branches-badge: true
        branches-badge-filename: jacoco-branches.svg
        coverage-label: coverage
        branches-label: branches
        colors: '#4c1 #97ca00 #a4a61d #dfb317 #fe7d37 #e05d44'
        intervals: 100 90 80 70 60 0
        generate-summary: false
        generate-workflow-summary: false
    - name: Check current folder
      run: ls -al
    - name: Check Untracked
      id: untracked
      run: |
        IS_UNTRACKED=$(echo $(git status | grep -c svg))
        echo "exist=${IS_UNTRACKED}" >> "${GITHUB_OUTPUT}"
        echo $IS_UNTRACKED        
    - name: Commit Badges   
      if: ${{ steps.untracked.outputs.exist > 0 }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add *.svg
        git commit -m "Add/Update all svg badges"
    - name: Push badge commit
      uses: ad-m/github-push-action@master
      if: ${{ success() }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: badges
      
  
