name: Build
run-name: ${{ github.actor }} 

on:
  push:
    branches: [ main ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'oracle-openjdk'
    - name: Build with Maven
      run: mvn clean package    
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      id: test-results
      if: (!cancelled())
      with:
        files: "./payment-app-main/target/surefire-reports/*.xml"
    - uses: actions/checkout@v7
      with:
        ref: badges
    - name: Conclusion
      run: echo "Conclusion is ${{ fromJSON( steps.test-results.outputs.json ).conclusion }}"
    - name: Generate the badge SVG image
      uses: emibcn/badge-action@v2.0.4
      id: badge
      with:
        label: 'Test coverage'
        status: 90
        color: 'blue,555,daf'
        path: ./test-badge.svg
    - name: Check current folder
      run: ls -al
      
      
  
