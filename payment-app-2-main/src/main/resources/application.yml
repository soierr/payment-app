server:
  port: 8082
spring:
  config:
    import: optional:classpath:creds-local.yml # for local env
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/payment-db
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  liquibase:
    change-log: db/changelog/db.changelog-master.xml
external:
  partners:
    "merchant_1":
      payment-url: "http://localhost:8080/bank-1/payment"
      idempotent: true
    "merchant_2":
      payment-url: "http://localhost:8080/bank-2/payment"
      idempotent: true
logging:
  level:
    root: INFO
    org.springframework.web: TRACE
    org.springframework.web.HttpLogging: TRACE